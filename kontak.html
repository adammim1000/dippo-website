<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hubungi Kami – Dippo</title>
<meta name="description" content="Isi formulir singkat, pesanmu langsung terkirim ke WhatsApp Dippo.">
<link rel="icon" href="assets/maskot-dippo.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/nav.css"><link rel="stylesheet" href="css/system.css"><link rel="stylesheet" href="css/motion.css">
</head>
<body class="">
<main>
<section class="sub"><div class="wrap">
  <h1 style="color:var(--blue)">Hubungi Kami</h1>
  <p class="lead">Isi formulir, lalu tekan Kirim lewat WhatsApp. Pesanmu otomatis terisi di WhatsApp, tinggal dikirim.</p>
</div></section>
<section><div class="wrap">
  <form id="form-kontak">
    <label>Nama lengkap<input name="nama" required autocomplete="name"></label>
    <label>Jasa yang dibutuhkan
      <select name="jasa" required><option>Dippo AI</option><option>Dippo Creative</option><option>Dippo Edu</option></select></label>
    <label>Kebutuhan<textarea name="pesan" required placeholder="Ceritakan singkat apa yang kamu butuhkan"></textarea></label>
    <button class="btn" type="submit">Kirim lewat WhatsApp</button>
  </form>
</div></section>
</main>
<div id="site-footer"></div>
<script src="js/shared.js"></script>
<script src="js/main.js"></script>
<script src="js/motion.js"></script>
</body>
</html>
